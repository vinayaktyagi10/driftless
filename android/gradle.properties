# This file was absent from the scaffold. Without android.useAndroidX the build
# fails outright the moment any AndroidX artifact is on the classpath, which is
# immediately — appcompat and core-ktx were already declared.

android.useAndroidX=true

# R classes carry only this module's resources rather than every dependency's.
# Default in AGP 8, set explicitly so it survives an AGP downgrade.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
